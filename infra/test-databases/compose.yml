# The test databases: one container per engine on a fixed loopback port, for the engines'
# *.db.test.ts suites. Start them with scripts/test-databases.sh (`up [engine…]`, `env`, `status`,
# `down`), not with compose directly: it picks `podman compose` or `docker compose`, waits until
# each engine is healthy and prints its URL variable. It runs with rootless Podman or with Docker
# Compose (CI uses Docker Compose, before the database tests). The whole set needs about 6 GB of
# memory (SQL Server 2 GB, Oracle Free about 2 GB): a laptop starts engines by name. Postgres is not
# here: DATABASE_URL names the one you already run.
#
# The passwords are test-only and written here: nothing of a customer ever enters these containers,
# and every port binds to 127.0.0.1. Every image is pinned by tag and digest; to move one, resolve
# its tag's digest again and change both, e.g.
#   skopeo inspect --format '{{.Digest}}' docker://docker.io/library/mysql:8.4
# Healthchecks use the CMD-SHELL form only: podman-compose 1.0.6 (Ubuntu 24.04) joins the
# arguments of the exec form into one word. The URLs live in scripts/test-databases.sh.
name: facetdb-test-databases

services:
  mysql:
    image: docker.io/library/mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: facetdb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: facetdb
      MYSQL_DATABASE: facetdb
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # Over TCP: the server the image runs to initialise a first start listens on its socket only.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -pfacetdb -e 'select 1' facetdb"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  mariadb:
    image: docker.io/library/mariadb:10.6@sha256:f1c56f035ed268a0d7c2c2e06dc879f6319b997cb434cf822a4cfd72a7aa184d
    container_name: facetdb-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: facetdb
      MARIADB_DATABASE: facetdb
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -uroot -pfacetdb -e 'select 1' facetdb"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  mssql:
    # amd64 only: this digest pins a single-arch linux/amd64 image (SQL Server's is published for
    # amd64 alone), so an arm64 machine (Apple silicon, an ARM VPS) runs it under emulation at best.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    container_name: facetdb-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # SQL Server refuses a weak sa password: eight characters or more, three kinds of four.
      MSSQL_SA_PASSWORD: Facetdb-test-1
    # SQL Server's minimum, and the most it may take.
    mem_limit: 2g
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P Facetdb-test-1 -l 5 -b -Q 'select 1'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 60s

  mongo:
    image: docker.io/library/mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: facetdb-mongo
    # A one-node replica set (change streams need one), with no authentication (a replica set with
    # it needs a key file), its cache capped at 256 MB (it may otherwise grow to half the host's
    # memory).
    command: --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      # The first check initiates the set with the member 127.0.0.1:27017, an address the host
      # reaches through the published port as well; healthy once the node is the writable primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }
          if (!db.hello().isWritablePrimary) quit(1)'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  libsql:
    # sqld. Its tags are libsql commits since v0.24.33; d6c75af was `latest` when pinned.
    image: ghcr.io/tursodatabase/libsql-server:d6c75af@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    container_name: facetdb-libsql
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The image has no curl or wget: bash's /dev/tcp asks sqld's /health for its 200.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  cockroach:
    image: docker.io/cockroachdb/cockroach:latest-v24.3@sha256:c26f6eca2ce7ab783862cca4a88f6b8b0da006864e16109b1bb3e30d7670bab9
    container_name: facetdb-cockroach
    # Insecure: no TLS and no passwords (the root user logs in without one). The binary runs
    # directly: the image's entrypoint script (cockroach.sh) starts the node, then checks whether
    # defaultdb exists and runs CREATE DATABASE defaultdb without IF NOT EXISTS; a node not yet
    # answering reads as "missing", the create fails on the database every fresh cluster has, and
    # set -e exits the container (seen in CI). defaultdb exists on every fresh node.
    entrypoint: ["/cockroach/cockroach"]
    command: ["start-single-node", "--insecure"]
    ports:
      - "127.0.0.1:26257:26257"
    healthcheck:
      test: ["CMD-SHELL", "/cockroach/cockroach sql --insecure --host=127.0.0.1:26257 --execute='select 1'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  oracle:
    image: docker.io/gvenzl/oracle-free:23-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd
    container_name: facetdb-oracle
    environment:
      # SYS and SYSTEM; the pluggable database's service is FREEPDB1.
      ORACLE_PASSWORD: facetdb
    ports:
      - "127.0.0.1:1521:1521"
    healthcheck:
      # The image's own check (on its PATH): the database is open.
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 120s
