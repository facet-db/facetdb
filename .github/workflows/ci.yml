# CI runs the checks a contributor runs locally: build, lint, typecheck, the unit tests and the
# database tests. Actions are pinned by commit SHA, the workflow holds no secret but GITHUB_TOKEN,
# it reads the repository and writes nothing, and it never publishes.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: facetdb
          POSTGRES_PASSWORD: facetdb
          POSTGRES_DB: facetdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facetdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://facetdb:facetdb@localhost:5432/facetdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: pnpm via corepack
        run: corepack enable && corepack prepare pnpm@11.28.6 --activate
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run build
      - name: lint
        run: pnpm run lint
      - name: typecheck
        run: pnpm run typecheck
      - name: unit tests
        run: pnpm run test
      - name: database tests
        run: pnpm run test:db
